schema: spec-driven

context: |
  Language: Russian (ru-RU).

  Основной рабочий язык проекта и всех OpenSpec workflow — русский.

  Во ВСЕХ взаимодействиях с пользователем отвечай на русском языке, включая:
  - вопросы и ответы во время explore;
  - уточняющие вопросы во время propose;
  - сообщения о ходе propose;
  - update;
  - apply;
  - verify;
  - sync;
  - archive;
  - итоговые отчеты, предупреждения, рекомендации и резюме.

  Не переходи на английский язык только потому, что встроенные инструкции,
  примеры или шаблоны OpenSpec написаны на английском.

  Все человекочитаемые OpenSpec-артефакты также пиши на русском языке.

  На английском сохраняй только:
  - обязательные структурные маркеры OpenSpec;
  - имена классов, методов, файлов, каталогов, API и другие идентификаторы;
  - код и команды;
  - устоявшиеся технические термины, если перевод ухудшает понимание.

  Служебные конструкции формата OpenSpec, необходимые для корректного
  парсинга и валидации, оставляй на английском языке.
  В частности: Requirement, Scenario, WHEN, THEN, SHALL, MUST,
  ADDED Requirements, MODIFIED Requirements, REMOVED Requirements,
  RENAMED Requirements.

  Имена классов, методов, интерфейсов, таблиц, колонок, файлов,
  каталогов, API, CSS-классов, конфигурационных параметров и другие
  идентификаторы из исходного кода сохраняй без перевода.

  Стиль документации:
  - максимально кратко и предметно;
  - приоритет сути над полнотой описания;
  - избегать повторения одной информации в разных артефактах;
  - не объяснять очевидные детали реализации;
  - не пересказывать исходный код;
  - фиксировать только решения и ограничения, важные для реализации;
  - объем документации должен быть пропорционален сложности и риску изменения.

  Для небольших локальных изменений документация должна быть минимальной.
  Для архитектурных, интеграционных и рискованных изменений допускается
  более подробное описание.

  Проект основан на BPMSoft.
  При проектировании учитывать существующие механизмы расширения BPMSoft
  и предпочитать расширение существующего поведения изменению
  платформенного/vendor-кода.

rules:

  proposal:
    - Пиши на русском языке.
    - Максимальный рекомендуемый объем — 150 слов.
    - Опиши цель изменения и его границы.
    - Указывай non-goals только если они действительно помогают ограничить scope.
    - Не пересказывай design, specs и tasks.
    - Не добавляй общие рассуждения и очевидные детали.

  specs:
    - Пиши описание требований и сценариев на русском языке.
    - Служебные заголовки и маркеры OpenSpec оставляй на английском.
    - Описывай только поведение, которое добавляется или изменяется.
    - Не документируй существующее поведение, которое изменение не затрагивает.
    - Для небольшого изменения достаточно минимального набора требований и сценариев.
    - Каждый сценарий должен проверять значимое наблюдаемое поведение.
    - Не создавай отдельные сценарии для очевидных технических деталей.
    - Избегай дублирования одного требования разными словами.

  design:
    - Пиши на русском языке.
    - Максимальный рекомендуемый объем — 250 слов для обычной задачи.
    - Описывай только существенные технические решения.
    - Указывай затрагиваемые компоненты, когда это важно для понимания решения.
    - Не пересказывай specs.
    - Не пересказывай tasks.
    - Не описывай очевидные конструкции языка и стандартные действия разработчика.
    - Для простого изменения допускается очень короткий design.
    - Для BPMSoft предпочитай существующие extension points и паттерны проекта.
    - Явно отмечай изменение платформенного/vendor-кода, если оно предлагается.

  tasks:
    - Пиши на русском языке.
    - Для обычной задачи используй не более 7 основных пунктов.
    - Не дроби тривиальные действия на отдельные задачи.
    - Каждая задача должна описывать конкретное проверяемое действие.
    - Сохраняй порядок реализации там, где он имеет значение.
    - Проверки и тесты объединяй логично, избегая избыточной детализации.
    - Не повторяй текст design или specs.

operations:

  apply:
    guidance:
      - Работай строго в рамках утвержденного change.
      - Не расширяй scope без явного согласования с разработчиком.
      - Пиши сообщения о ходе реализации на русском языке.
      - Сообщай кратко, какие tasks выполнены и какие файлы существенно изменены.
      - Не создавай длинные объяснения очевидных изменений.
      - При обнаружении противоречия между кодом и спецификацией остановись и обозначь проблему.
      - Не принимай архитектурные решения, выходящие за рамки design, без согласования.

  archive:
    guidance:
      - Итоговое сообщение пиши на русском языке.
      - Кратко перечисли реализованный результат и существенные отклонения от первоначального плана.
      - Не создавай подробный повтор proposal, specs, design и tasks.
